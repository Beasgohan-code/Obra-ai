<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>obra</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body{font-family:system-ui;background:var(--tg-theme-bg-color,#0f1115);color:var(--tg-theme-text-color,#e6e6e6);margin:0;padding:1rem}
    .card{background:var(--tg-theme-secondary-bg-color,#1a1d24);padding:1rem;border-radius:12px;margin-bottom:1rem}
    button{background:var(--tg-theme-button-color,#3b82f6);color:var(--tg-theme-button-text-color,#fff);border:none;padding:.7rem 1.2rem;border-radius:10px;font-weight:600;width:100%;margin:.3rem 0}
    h2{margin-top:0}
    input,textarea{width:100%;box-sizing:border-box;padding:.6rem;border-radius:8px;border:1px solid #333;background:#111;color:#fff;margin:.4rem 0}
  </style>
</head>
<body>
  <div class="card">
    <h2>obra Mini App</h2>
    <p id="user">Loading…</p>
  </div>
  <div class="card">
    <p>Send a quick prompt to the bot chat:</p>
    <textarea id="prompt" rows="3" placeholder="Ask obra anything…"></textarea>
    <button onclick="sendPrompt()">Send to chat</button>
  </div>
  <div class="card">
    <button onclick="tg.close()">Close</button>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const u = tg.initDataUnsafe?.user;
    document.getElementById('user').textContent = u
      ? `Hello, ${u.first_name || 'user'} (id ${u.id})`
      : 'Open from Telegram for full context';

    function sendPrompt() {
      const text = document.getElementById('prompt').value.trim();
      if (!text) return;
      // Opens bot chat with prefilled text (Telegram deep link style via switchInline / sendData)
      tg.sendData(JSON.stringify({ action: "prompt", text }));
      tg.HapticFeedback?.notificationOccurred?.('success');
      tg.close();
    }
  </script>
</body>
</html>
