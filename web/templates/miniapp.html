<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>obra · workspace</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/miniapp.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>"/>
</head>
<body>
  <header>
    <span class="dot"></span><b>obra</b>
    <span id="who" style="color:var(--muted);font-size:.85rem"></span>
    <span class="spacer"></span>
    <span class="plan" id="plan">…</span>
  </header>
  <main>
    <div id="auth-err" class="err"></div>

    <div class="card">
      <h3>Ask obra</h3>
      <div class="chips" style="margin-bottom:.6rem">
        <button class="chip active" data-agent="default">✨ Auto</button>
        <button class="chip" data-agent="coder">💻 Coder</button>
        <button class="chip" data-agent="researcher">🔍 Research</button>
        <button class="chip" data-agent="writer">✍️ Writer</button>
        <button class="chip" data-agent="solver">🚀 Solver</button>
        <button class="chip" data-agent="terminal">⌨️ Terminal</button>
      </div>
      <div id="feed"></div>
    </div>

    <div class="card"><h3>Usage</h3><div id="usage">…</div></div>
    <div class="card"><h3>Memory</h3><div id="memory">…</div></div>
    <div class="card"><h3>Projects</h3><div id="projects">…</div></div>
    <div class="card"><h3>Skills</h3><div id="skills">…</div></div>
    <p class="hint">Replies arrive in your Telegram chat with the bot.</p>
  </main>

  <div id="composer">
    <textarea id="prompt" rows="2" placeholder="Ask obra anything…"></textarea>
    <button class="send" id="send" style="margin-top:.5rem">Send to chat ➤</button>
  </div>
  <script src="/static/miniapp.js"></script>
</body>
</html>
