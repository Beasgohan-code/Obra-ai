<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>obra · login</title>
  <style>
    :root{--bg:#0b0d12;--card:#151926;--line:#262d42;--text:#e8ecf4;--muted:#8b94ab;--accent:#6c8cff}
    *{box-sizing:border-box}
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 600px at 20% 10%,rgba(108,140,255,.15),transparent),radial-gradient(800px 500px at 80% 90%,rgba(34,211,238,.12),transparent),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2.2rem;width:min(92vw,360px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
    .logo{display:flex;align-items:center;gap:.6rem;font-size:1.3rem;font-weight:700;margin-bottom:.3rem}
    .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#22d3ee);box-shadow:0 0 14px var(--accent)}
    p{color:var(--muted);font-size:.85rem;margin:.2rem 0 1.4rem}
    input{width:100%;padding:.75rem .9rem;margin:.4rem 0;border-radius:12px;border:1px solid var(--line);background:#0e1119;color:var(--text);font-size:.95rem}
    input:focus{outline:none;border-color:var(--accent)}
    button{width:100%;padding:.8rem;margin-top:.8rem;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),#4f6ef7);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
    button:hover{filter:brightness(1.1)}
    .err{color:#f87171;font-size:.8rem;min-height:1em;margin-top:.5rem}
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="logo"><span class="dot"></span>obra</div>
    <p>Admin dashboard — enter DASHBOARD_SECRET</p>
    <input type="hidden" name="csrf" value="{{ csrf }}"/>
    <input type="password" name="secret" placeholder="secret" required autocomplete="current-password"/>
    <button type="submit">Sign in</button>
    <div class="err" id="e"></div>
  </form>
  <script src="/static/login.js"></script>
</body>
</html>
